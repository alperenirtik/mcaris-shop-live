version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:mcaris_secure_pass_2026@postgres:5432/mcaris_db?schema=public
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_URL=https://shop.mcaris.com.tr
      - JWT_SECRET=mcaris-super-secret-jwt-key-2026
      - NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY=4bf40ade-771b-4cf9-ac9b-055a78543c1d
      - ODEAL_BASE_URL=https://api.odeal.com
    depends_on:
      - postgres
    volumes:
      - app_uploads:/app/public/uploads
      - app_backups:/app/backups

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mcaris_secure_pass_2026
      POSTGRES_DB: mcaris_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  app_uploads:
  app_backups:
